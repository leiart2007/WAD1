<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAD1 Viloria's Repo | Score Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main class="container">
        <h1>Score Tracker</h1>

        <section class="score-display">
            Current Score: <span id="score-display">0</span>
        </section>

        <section class="button-group">
            <button class="pink-btn" id="increase-btn">Add Point</button>
            <button class="pink-btn" id="decrease-btn">Subtract</button>
            <button class="pink-outline-btn" id="reset-btn">Reset</button>
        </section>

        <footer class="ui-message">
            "Keep going to raise your score!"
        </footer>
    </main>
</body>

</html>
